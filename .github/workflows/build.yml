name: Build and test
on: [push, pull_request]
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          modules: 'qtimageformats qtwebengine'
          cache: true
      - uses: seanmiddleditch/gha-setup-ninja@master
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Windows zlib
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static-md
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake --preset debug -DZYRI_SANITIZERS=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake --preset debug -DZYRI_SANITIZERS=${{ runner.os != 'Windows' && 'ON' || 'OFF' }} -DZYRI_SANITIZER_SET=${{ runner.os == 'macOS' && 'undefined' || 'address,undefined' }}
      - name: Build
        run: cmake --build --preset debug --parallel 4
      - name: Test
        run: ctest --preset debug
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
      - name: Generate file fixtures
        run: ./build-debug/Zyri --render-demo build-debug/fixtures
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
